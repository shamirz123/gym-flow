# Development: database only
#   docker compose up -d db
# The whole app in Docker (production-like):
#   docker compose --profile app up --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymflow
      POSTGRES_PASSWORD: gymflow
      POSTGRES_DB: gymflow
    ports:
      - "5433:5432" # 5433 to avoid clashing with an existing local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymflow -d gymflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gymflow:gymflow@db:5432/gymflow
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me-please-32chars}
      CLIENT_URL: http://localhost:3000
      ROOT_DOMAIN: localhost:3000
      PORT: "5050"
    ports:
      - "5050:5050"
    volumes:
      - uploads:/app/uploads

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5050
        NEXT_PUBLIC_ROOT_DOMAIN: localhost:3000
    depends_on:
      - api
    environment:
      API_URL_INTERNAL: http://api:5050
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
